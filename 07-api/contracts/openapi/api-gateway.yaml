  /api/v1/attendance-records:
    get:
      summary: Proxy → attendance (401 sin bearer en el MS, 200/min)
      tags: [Attendance]
      responses:
        '200':
          description: Proxied (ver 05-attendance-service.yaml)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/justifications:
    get:
