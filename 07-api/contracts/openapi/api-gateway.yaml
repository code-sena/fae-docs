openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Punto único de entrada (Kong OSS 3.6 DB-less + Redis 7).
    Fuente real: `back-end/99-api-gateway/kong/kong.yml` (`_format_version 3.0`, `strip_path:false`).

    ## Puertos
    - Proxy `:8080` (contenedor `8000`), Admin `:8001`.
    - Frontends MUST usar `:8080/api/v1/...`. Acceso directo a `8081-8089` solo para dev/debug.

    ## Authentication
    ```
    Authorization: Bearer <sessionId>
    ```
    Opaque `sessionId` (UUID) issued by `POST /api/v1/auth/login` (identity 8081; `identifier` =
    email or username). See `../authentication.md`.

    **Kong validates the session at the edge.** A global `pre-function` (Lua) requires the bearer
    on every non-public route and calls `GET ms-identity:8081/api/v1/sessions/{id}` demanding
    `sessionStatus = "Active"`:
    - `401` when the header is missing, there is no `Bearer`, the token is not an 8-4-4-4-12 UUID,
      or the session is invalid/closed/expired (`Missing or invalid bearer token` |
      `Invalid or expired session`).
    - `503` when identity does not answer (`Cannot verify session`).
    - No cache: **one identity call per authenticated request**. Requires
      `KONG_UNTRUSTED_LUA_SANDBOX_REQUIRES=resty.http`.
    - Public routes (no token): `OPTIONS` (CORS), `/health*`, `/api/v1/health`, `/api/health`,
      `POST /api/v1/auth/{login,logout,refresh,forgot-password,verify-code,reset-password}` and
      `GET /api/v1/auth/me`.

    The bearer is an **opaque session, not a JWT**: Kong has no `jwt` plugin and no consumers
    (only `pre-function` + `cors` + `rate-limiting`), and `jwt` RS256 issued by identity remains
    a future evolution (ADR-007). The gateway **only authenticates**: permissions (RBAC) are
    still evaluated by the Java services (`01/02/04/05`, `AuthTokenFilter`). The TS/Python/Go
    services (`03/06/07/08/09`) check nothing on their own — direct access on their internal
    ports validates nothing (tech-debt `AT-004`, risk `R-003`).

    ## Rate limits (Redis)
    Global 300/min; identity 60/min; authorization 100/min; attendance 200/min; quality 100/min.

    ## CORS
    Global `http://localhost:3000,http://localhost:5173,http://localhost:8090` (`Authorization,Content-Type,X-Requested-With`, `credentials:true`, `max_age:3600`).
    Identity route `*` para dev.

    ## Headers internos (convención Kong→upstream)
    - `X-User-Id`, `X-User-Roles` (fijados por el `AuthTokenFilter` Java), `X-Correlation-Id` / `X-Request-Id`.

    ## Health
    El gateway NO expone `GET /health`; solo rutea `GET /health/quality` → `ms-academic:8083`.
    Las saludades se prueban directo contra cada puerto.

servers:
  - url: http://localhost:8080
    description: Via Kong (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security:
  - bearerAuth: []

tags:
  - name: Health
    description: Estado de los upstreams (solo `/health/quality` está ruteado)
  - name: Identity
    description: Proxied → ms-identity:8081 (public bootstrap routes; the rest require the bearer)
  - name: Authorization
    description: Proxied → ms-authorization:8082 (bearer checked at the edge and in the MS)
  - name: Academic
    description: Proxied → ms-academic:8083 (gateway-only session check; the MS validates nothing)
  - name: Scheduling
    description: Proxied → ms-scheduling:8084 (bearer checked at the edge and in the MS)
  - name: Attendance
    description: Proxied → ms-attendance:8085 (bearer checked at the edge and in the MS)
  - name: Biometric
    description: Proxied → ms-biometric:8086 (gateway-only session check; the MS serves raw embeddings)
  - name: Configuration
    description: Proxied → ms-configuration:8087 (gateway-only session check; the MS validates nothing)
  - name: Notification
    description: Proxied → ms-notification:8088 (gateway-only session check; the MS validates nothing)
  - name: Quality
    description: Proxied → ms-quality:8089 (gateway-only session check; the MS validates nothing)

paths:
  /health/quality:
    get:
      summary: Health de calidad (proxied a ms-academic:8083, solo CORS GET; única ruta de health en el gateway)
      tags: [Health]
      security: []
      responses:
        '200':
          description: Reporte de calidad
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/QualityReport'

  /api/v1/persons:
    get:
      summary: Proxy → identity (ver 01-identity-service.yaml; edge bearer required)
      tags: [Identity]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/users:
    get:
      summary: Proxy → identity (edge bearer required)
      tags: [Identity]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/login:
    post:
      summary: Proxy → identity login (público, obtiene `sessionId` opaco)
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                identifier:
                  type: string
                  description: Email o username (alias aceptados: `email`, `username`)
                email:
                  type: string
                  description: Alias de `identifier`
                username:
                  type: string
                  description: Alias de `identifier`
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
  /api/v1/sessions:
    post:
      summary: Proxy → identity sessions (edge bearer required)
      tags: [Identity]
      responses:
        '201':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/password-policies:
    get:
      summary: Proxy → identity password-policies (edge bearer required)
      tags: [Identity]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/roles:
    get:
      summary: Proxy → authorization (401 sin bearer en el MS, 100/min)
      tags: [Authorization]
      responses:
        '200':
          description: Proxied (ver 02-authorization-service.yaml)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
  /api/v1/permissions:
    get:
      summary: Proxy → authorization (401 without bearer: gateway + MS)
      tags: [Authorization]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/auth/evaluate:
    get:
      summary: Proxy → authorization RBAC check (401 without bearer: gateway + MS)
      tags: [Authorization]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
        - name: permission
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{userId,permission,allowed}'
          content:
            application/json:
              schema:
                type: object

  /api/v1/schools:
    get:
      summary: Proxy → academic (gateway-only session check)
      tags: [Academic]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Proxied (ver 03-academic-service.yaml)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/programs:
    get:
      summary: Proxy → academic (gateway-only session check)
      tags: [Academic]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/academic-periods:
    get:
      summary: Proxy → academic (sin auth en el MS hoy, alias /periods)
      tags: [Academic]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/cohorts:
