openapi: 3.0.3
info:
  title: Attendance Service API
  version: 1.0.0
  description: |
    Servicio 05-ms-attendance (Java 21 Spring Boot 4.1 :8085, schema `attendance`).
    Registros de asistencia, tipos de justificación, justificaciones y documentos de soporte.
    Critical path ACID con `@Transactional`.
    `justification_type.school_id` INT NULL (NULL = global); unique `(school_id,name)`
    + partial unique `(name)` WHERE `school_id IS NULL`.
    `attendance_report` (DBML v7, derived JSONB projection, no FKs) has NO endpoints yet — gap.

    ## Fuente real
    - Controllers: `AttendanceRecordController`, `JustificationController`,
      `JustificationTypeController`, `SupportingDocumentController`,
      `AttendanceRelationsController`, `HealthController`, `QualityHealthController`
    - Enums: `attendanceStatus Present/Absent/Late/Justified`, `captureMethod FACIAL/MANUAL/IOT/IMPORT`
    - Bulk: `POST /api/v1/attendance-records/bulk`
    - Summary: `GET /api/v1/attendance-records/summary?academicActorIds` → per-actor counts
      (SQL aggregation; `{}` without ids, max 300 ids per request)
    - Review: `PATCH /api/v1/justifications/{id}/review {reviewStatus,reviewedBy,resolutionNotes}`
    - Gateway: the edge `pre-function` (Lua) validates the opaque session UUID against identity
      before the request reaches this service, plus `rate-limiting 200/min` and the global
      `cors`; no `jwt` plugin. The MS validates the bearer again with `AuthTokenFilter`
      (`kong.yml:68-86, 150-192`).
    - Legacy alias: routes are also declared **without** the `/api/v1` prefix
      (`/attendance-records`, `/attendance-records/bulk`, `/attendance-records/summary`,
      `/justifications`, `/justification-types`, `/supporting-documents`). Kong routes only the
      `/api/v1/...` form; the alias works on the direct port only, where `AuthTokenFilter` does
      not run (it guards paths starting with `/api/`). Not part of the contract.

servers:
  - url: http://localhost:8085
    description: Direct (dev)
  - url: http://localhost:8080
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security:
  - bearerAuth: []

tags:
  - name: AttendanceRecord
  - name: Justification
  - name: JustificationType
  - name: SupportingDocument
  - name: Relations
  - name: Health

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      summary: Health versionado
      tags: [Health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /health/quality:
    get:
      summary: Reporte de calidad
      tags: [Health]
      security: []
      responses:
        '200':
          description: Reporte ISO
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/QualityReport'

  /api/v1/attendance-records:
    get:
      summary: Listar registros (filtros sesión/actor/estado)
      operationId: listAttendanceRecords
      tags: [AttendanceRecord]
      parameters:
        - name: classSessionId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: academicActorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: attendanceStatus
          in: query
          required: false
          schema:
            type: string
            enum: [Present, Absent, Late, Justified]
      responses:
        '200':
          description: Lista de registros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecordResponse'
    post:
      summary: Registrar asistencia
      operationId: createAttendanceRecord
      tags: [AttendanceRecord]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttendanceRecordRequest'
      responses:
        '201':
          description: Registro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordResponse'

  /api/v1/attendance-records/bulk:
    post:
      summary: Registro masivo
      operationId: bulkCreateAttendanceRecords
      tags: [AttendanceRecord]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/CreateAttendanceRecordRequest'
      responses:
        '201':
          description: Registros creados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecordResponse'

  /api/v1/attendance-records/summary:
    get:
      summary: Per-actor attendance counts (SQL aggregation)
      description: |
        Counts per `academicActorId` so a view does not have to download every record
        (~81k rows) to compute attendance percentages. The response carries counts and not a
        pre-computed percentage: deciding what counts as attended is a view decision.
        Without `academicActorIds` the answer is `{}`; at most 300 ids per request.
      operationId: summarizeAttendanceRecords
      tags: [AttendanceRecord]
      parameters:
        - name: academicActorIds
          in: query
          required: false
          style: form
          explode: true
          description: Repeated or comma-separated actor ids, at most 300 per request
          schema:
            type: array
            maxItems: 300
            items:
              type: integer
              format: int64
      responses:
        '200':
          description: '`{academicActorId: AttendanceSummaryResponse}`'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/AttendanceSummaryResponse'
        '400':
          description: More than 300 `academicActorIds` in one request
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /api/v1/attendance-records/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Obtener registro
      operationId: getAttendanceRecord
      tags: [AttendanceRecord]
      responses:
        '200':
          description: Registro encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar registro
      operationId: updateAttendanceRecord
      tags: [AttendanceRecord]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttendanceRecordRequest'
      responses:
        '200':
          description: Registro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecordResponse'
    delete:
      summary: Eliminar registro
      operationId: deleteAttendanceRecord
      tags: [AttendanceRecord]
      responses:
        '204':
          description: Eliminado

  /api/v1/justifications:
    get:
      summary: Listar justificaciones (filtros estado/registro)
      operationId: listJustifications
      tags: [Justification]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: attendanceRecordId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista de justificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JustificationResponse'
    post:
      summary: Crear justificación
      operationId: createJustification
      tags: [Justification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJustificationRequest'
      responses:
        '201':
          description: Justificación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationResponse'

  /api/v1/justifications/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Obtener justificación
      operationId: getJustification
      tags: [Justification]
      responses:
        '200':
          description: Justificación encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar justificación
      operationId: deleteJustification
      tags: [Justification]
      responses:
        '204':
          description: Eliminada

  /api/v1/justifications/{id}/review:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    patch:
      summary: Revisar justificación (Approved/Rejected)
      operationId: reviewJustification
      tags: [Justification]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewJustificationRequest'
      responses:
        '200':
          description: Justificación revisada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationResponse'

  /api/v1/justification-types:
    get:
      summary: Listar tipos de justificación
      operationId: listJustificationTypes
      tags: [JustificationType]
      responses:
        '200':
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JustificationTypeResponse'
    post:
      summary: Crear tipo de justificación
      operationId: createJustificationType
      tags: [JustificationType]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJustificationTypeRequest'
      responses:
        '201':
          description: Tipo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationTypeResponse'

  /api/v1/justification-types/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener tipo
      operationId: getJustificationType
      tags: [JustificationType]
      responses:
        '200':
          description: Tipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationTypeResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar tipo
      operationId: updateJustificationType
      tags: [JustificationType]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJustificationTypeRequest'
      responses:
        '200':
          description: Tipo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationTypeResponse'
    delete:
      summary: Eliminar tipo
      operationId: deleteJustificationType
      tags: [JustificationType]
      responses:
        '204':
          description: Eliminado

  /api/v1/supporting-documents:
    get:
      summary: Listar documentos (filtro justificación)
      operationId: listSupportingDocuments
      tags: [SupportingDocument]
      parameters:
        - name: justificationId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Lista de documentos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportingDocumentResponse'
    post:
      summary: Crear documento de soporte
      operationId: createSupportingDocument
      tags: [SupportingDocument]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupportingDocumentRequest'
      responses:
        '201':
          description: Documento creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportingDocumentResponse'

  /api/v1/supporting-documents/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Obtener documento
      operationId: getSupportingDocument
      tags: [SupportingDocument]
      responses:
        '200':
          description: Documento encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportingDocumentResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar documento
      operationId: deleteSupportingDocument
      tags: [SupportingDocument]
      responses:
        '204':
          description: Eliminado

  /api/v1/class-sessions/{id}/attendance:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Asistencia por sesión
      operationId: listAttendanceBySession
      tags: [Relations]
      responses:
        '200':
          description: Registros de la sesión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecordResponse'

  /api/v1/academic-actors/{actorId}/attendance:
    parameters:
      - name: actorId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      summary: Asistencia por actor
      operationId: listAttendanceByActor
      tags: [Relations]
      responses:
        '200':
          description: Registros del actor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecordResponse'

  /api/v1/attendance/{id}/justification:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Justificación por registro (single|null)
      operationId: getJustificationByRecord
      tags: [Relations]
      responses:
        '200':
          description: Justificación del registro o null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JustificationResponse'

  /api/v1/justifications/{id}/documents:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Documentos por justificación
      operationId: listDocumentsByJustification
      tags: [Relations]
      responses:
        '200':
          description: Documentos de la justificación
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupportingDocumentResponse'

components:
  schemas:
    CreateAttendanceRecordRequest:
      type: object
      required: [classSessionId, academicActorId, attendanceStatus, captureMethod]
      properties:
        classSessionId:
          type: integer
          format: int64
        academicActorId:
          type: integer
          format: int64
        attendanceStatus:
          type: string
          enum: [Present, Absent, Late, Justified]
        captureMethod:
          type: string
          enum: [FACIAL, MANUAL, IOT, IMPORT]
        matchScore:
          type: number
          format: double
          nullable: true
          example: 0.97
    UpdateAttendanceRecordRequest:
      type: object
      properties:
        attendanceStatus:
          type: string
          enum: [Present, Absent, Late, Justified]
        captureMethod:
          type: string
          enum: [FACIAL, MANUAL, IOT, IMPORT]
        matchScore:
          type: number
          format: double
          nullable: true
        capturedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
    AttendanceRecordResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [attendanceRecordId, classSessionId, academicActorId, attendanceStatus, captureMethod]
          properties:
            attendanceRecordId:
              type: integer
              format: int64
            classSessionId:
              type: integer
              format: int64
            academicActorId:
              type: integer
              format: int64
            attendanceStatus:
              type: string
              enum: [Present, Absent, Late, Justified]
            captureMethod:
              type: string
              enum: [FACIAL, MANUAL, IOT, IMPORT]
            capturedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            matchScore:
              type: number
              format: double
              nullable: true
    AttendanceSummaryResponse:
      type: object
      description: Counts per actor. Deliberately counts and not a percentage — what counts as
        attended is a view decision, not an API decision.
      properties:
        present:
          type: integer
          format: int64
        late:
          type: integer
          format: int64
        absent:
          type: integer
          format: int64
        justified:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
    CreateJustificationRequest:
      type: object
      required: [attendanceRecordId, justificationTypeId, reason]
      properties:
        attendanceRecordId:
          type: integer
          format: int64
        justificationTypeId:
          type: integer
        reason:
          type: string
    ReviewJustificationRequest:
      type: object
      required: [reviewStatus]
      properties:
        reviewStatus:
          type: string
          example: Approved
        reviewedBy:
          $ref: './_shared.yaml#/components/schemas/UUID'
          nullable: true
        resolutionNotes:
          type: string
          nullable: true
    JustificationResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [justificationId, attendanceRecordId, justificationTypeId, reason]
          properties:
            justificationId:
              type: integer
              format: int64
            attendanceRecordId:
              type: integer
              format: int64
            justificationTypeId:
              type: integer
            reason:
              type: string
            submittedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            reviewedBy:
              $ref: './_shared.yaml#/components/schemas/UUID'
              nullable: true
            reviewedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
              nullable: true
            reviewStatus:
              type: string
              nullable: true
            resolutionNotes:
              type: string
              nullable: true
    CreateJustificationTypeRequest:
      type: object
      required: [name]
      properties:
        schoolId:
          type: integer
          nullable: true
          description: NULL = global type, NOT NULL = per-school custom type
        name:
          type: string
          maxLength: 255
          example: Calamidad doméstica
        description:
          type: string
          maxLength: 500
          nullable: true
        requiresAttachment:
          type: boolean
          default: false
        status:
          type: boolean
          default: true
    UpdateJustificationTypeRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        requiresAttachment:
          type: boolean
        status:
          type: boolean
    JustificationTypeResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [justificationTypeId, name]
          properties:
            justificationTypeId:
              type: integer
            schoolId:
              type: integer
              nullable: true
              description: NULL = global type, NOT NULL = per-school custom type
            name:
              type: string
            description:
              type: string
              nullable: true
            requiresAttachment:
              type: boolean
            status:
              type: boolean
    CreateSupportingDocumentRequest:
      type: object
      required: [justificationId, fileName, storageUri, mimeType, sizeBytes]
      properties:
        justificationId:
          type: integer
          format: int64
        fileName:
          type: string
        storageUri:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
    SupportingDocumentResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [supportingDocumentId, justificationId, fileName, storageUri, mimeType, sizeBytes]
          properties:
            supportingDocumentId:
              type: integer
              format: int64
            justificationId:
              type: integer
              format: int64
            fileName:
              type: string
            storageUri:
              type: string
            mimeType:
              type: string
            sizeBytes:
              type: integer
              format: int64
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
