          in: query
          description: Filtrar por curso
          schema:
            type: string
            format: uuid
        - name: teacherId
          in: query
          description: Filtrar por profesor
          schema:
            type: string
            format: uuid
        - name: classroomId
          in: query
          description: Filtrar por aula
          schema:
            type: string
            format: uuid
        - name: dayOfWeek
          in: query
          description: Filtrar por día de la semana
          schema:
            type: string
            enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
      responses:
        '200':
          description: Lista de horarios
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScheduleResponse'
                  meta:
                    $ref: './_shared.yaml#/components/schemas/PaginatedMeta'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

    post:
      summary: Crear horario
      operationId: createSchedule
      tags: [Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleRequest'
            example:
              courseId: "660e8400-e29b-41d4-a716-446655440001"
              teacherId: "880e8400-e29b-41d4-a716-446655440003"
              classroomId: "990e8400-e29b-41d4-a716-446655440004"
              dayOfWeek: "MONDAY"
              startTime: "08:00"
              endTime: "09:30"
      responses:
        '201':
          description: Horario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '409':
          description: Conflicto de horario (aula o profesor ocupado)
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

  /schedules/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IdParam'

    get:
      summary: Obtener horario por ID
      operationId: getScheduleById
      tags: [Schedule]
      responses:
        '200':
          description: Horario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: './_shared.yaml#/components/responses/InternalError'

    patch:
      summary: Actualizar horario
      operationId: updateSchedule
      tags: [Schedule]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateScheduleRequest'
      responses:
        '200':
          description: Horario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

    delete:
      summary: Eliminar horario
      operationId: deleteSchedule
      tags: [Schedule]
      responses:
        '204':
          description: Eliminado exitosamente
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

components:
  schemas:
    # ─── Student ────────────────────────────────────────────────────────
    CreateStudentRequest:
      type: object
      required: [personId, schoolId, studentCode]
      properties:
        personId:
          type: string
          format: uuid
          description: ID de la persona asociada
        schoolId:
          type: string
          format: uuid
          description: ID de la escuela
        studentCode:
          type: string
          minLength: 1
          maxLength: 50
          description: Código único del estudiante
        grade:
          type: string
          nullable: true
          maxLength: 50
          description: Grado actual

    UpdateStudentRequest:
      type: object
      properties:
        grade:
          type: string
          nullable: true
          maxLength: 50
        status:
          type: string
          enum: [ACTIVE, INACTIVE, GRADUATED]

    StudentResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, personId, schoolId, studentCode, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            personId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            schoolId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            studentCode:
              type: string
              example: "EST-2024-001"
            grade:
              type: string
              nullable: true
              example: "10mo"
            status:
              type: string
              enum: [ACTIVE, INACTIVE, GRADUATED]
              example: ACTIVE

    # ─── Teacher ────────────────────────────────────────────────────────
    CreateTeacherRequest:
      type: object
      required: [personId, schoolId, teacherCode]
      properties:
        personId:
          type: string
          format: uuid
          description: ID de la persona asociada
        schoolId:
          type: string
          format: uuid
          description: ID de la escuela
        teacherCode:
          type: string
          minLength: 1
          maxLength: 50
          description: Código único del profesor
        department:
          type: string
          nullable: true
          maxLength: 100
          description: Departamento o área

    UpdateTeacherRequest:
      type: object
      properties:
        department:
          type: string
          nullable: true
          maxLength: 100
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    TeacherResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, personId, schoolId, teacherCode, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            personId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            schoolId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            teacherCode:
              type: string
              example: "PROF-2024-001"
            department:
              type: string
              nullable: true
              example: "Matemáticas"
            status:
              type: string
              enum: [ACTIVE, INACTIVE]
              example: ACTIVE

    # ─── Course ─────────────────────────────────────────────────────────
    CreateCourseRequest:
      type: object
      required: [name, code, schoolId, periodId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Nombre del curso
        code:
          type: string
          minLength: 1
          maxLength: 50
          description: Código único del curso
        schoolId:
          type: string
          format: uuid
          description: ID de la escuela
        periodId:
          type: string
          format: uuid
          description: ID del período académico
        teacherId:
          type: string
          format: uuid
          nullable: true
          description: ID del profesor principal
        grade:
          type: string
          nullable: true
          maxLength: 50
          description: Grado al que pertenece

    UpdateCourseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        teacherId:
          type: string
          format: uuid
          nullable: true
        grade:
          type: string
          nullable: true
          maxLength: 50
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    CourseResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, name, code, schoolId, periodId, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            name:
              type: string
              example: "Matemáticas I"
            code:
              type: string
              example: "MAT-101"
            schoolId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            periodId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            teacherId:
              type: string
              format: uuid
              nullable: true
            grade:
              type: string
              nullable: true
              example: "10mo"
            status:
              type: string
              enum: [ACTIVE, INACTIVE]
              example: ACTIVE

    # ─── Classroom ──────────────────────────────────────────────────────
    CreateClassroomRequest:
      type: object
      required: [name, code, schoolId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre del aula
        code:
          type: string
          minLength: 1
          maxLength: 50
          description: Código único del aula
        schoolId:
          type: string
          format: uuid
          description: ID de la escuela
        capacity:
          type: integer
          minimum: 1
          description: Capacidad máxima
        building:
          type: string
          nullable: true
          maxLength: 100
          description: Edificio
        floor:
          type: integer
          nullable: true
          description: Piso

    UpdateClassroomRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        capacity:
          type: integer
          minimum: 1
        building:
          type: string
          nullable: true
          maxLength: 100
        floor:
          type: integer
          nullable: true
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    ClassroomResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, name, code, schoolId, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            name:
              type: string
              example: "Aula 101"
            code:
              type: string
              example: "A-101"
            schoolId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            capacity:
              type: integer
              example: 30
            building:
              type: string
              nullable: true
              example: "Edificio A"
            floor:
              type: integer
              nullable: true
              example: 1
            status:
              type: string
              enum: [ACTIVE, INACTIVE]
              example: ACTIVE

    # ─── Period ─────────────────────────────────────────────────────────
    CreatePeriodRequest:
      type: object
      required: [name, schoolId, startDate, endDate]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Nombre del período
        schoolId:
          type: string
          format: uuid
          description: ID de la escuela
        startDate:
          type: string
          format: date
          description: Fecha de inicio
        endDate:
          type: string
          format: date
          description: Fecha de fin

    UpdatePeriodRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [ACTIVE, UPCOMING, CLOSED]

    PeriodResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, name, schoolId, startDate, endDate, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            name:
              type: string
              example: "Primer Semestre 2024"
            schoolId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            startDate:
              type: string
              format: date
              example: "2024-01-15"
            endDate:
              type: string
              format: date
              example: "2024-06-30"
            status:
              type: string
              enum: [ACTIVE, UPCOMING, CLOSED]
              example: ACTIVE

    # ─── Enrollment ─────────────────────────────────────────────────────
    CreateEnrollmentRequest:
      type: object
      required: [studentId, courseId, periodId]
      properties:
        studentId:
          type: string
          format: uuid
          description: ID del estudiante
        courseId:
          type: string
          format: uuid
          description: ID del curso
        periodId:
          type: string
          format: uuid
          description: ID del período

    UpdateEnrollmentRequest:
      type: object
      properties:
        status:
          type: string
          enum: [ACTIVE, DROPPED, COMPLETED]

    EnrollmentResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, studentId, courseId, periodId, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            studentId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            courseId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            periodId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            status:
              type: string
              enum: [ACTIVE, DROPPED, COMPLETED]
              example: ACTIVE

    # ─── Schedule ───────────────────────────────────────────────────────
    CreateScheduleRequest:
      type: object
      required: [courseId, teacherId, classroomId, dayOfWeek, startTime, endTime]
      properties:
        courseId:
          type: string
          format: uuid
          description: ID del curso
        teacherId:
          type: string
          format: uuid
          description: ID del profesor
        classroomId:
          type: string
          format: uuid
          description: ID del aula
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
          description: Día de la semana
        startTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Hora de inicio (formato HH:mm)
          example: "08:00"
        endTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: Hora de fin (formato HH:mm)
          example: "09:30"

    UpdateScheduleRequest:
      type: object
      properties:
        teacherId:
          type: string
          format: uuid
        classroomId:
          type: string
          format: uuid
        dayOfWeek:
          type: string
          enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
        startTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        endTime:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    ScheduleResponse:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [id, courseId, teacherId, classroomId, dayOfWeek, startTime, endTime, status]
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            courseId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            teacherId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            classroomId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            dayOfWeek:
              type: string
              enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY]
              example: "MONDAY"
            startTime:
              type: string
              example: "08:00"
            endTime:
              type: string
              example: "09:30"
            status:
              type: string
              enum: [ACTIVE, INACTIVE]
              example: ACTIVE

  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
