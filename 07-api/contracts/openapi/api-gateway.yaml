  /api/v1/environments:
    get:
      summary: Proxy → scheduling (401 without bearer: gateway + MS)
      tags: [Scheduling]
      responses:
        '200':
          description: Proxied (ver 04-scheduling-service.yaml)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/schedule-blocks:
    get:
      summary: Proxy → scheduling (401 without bearer: gateway + MS)
      tags: [Scheduling]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/class-sessions:
    get:
      summary: Proxy → scheduling (401 without bearer: gateway + MS)
      tags: [Scheduling]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
