openapi: 3.0.3
info:
  title: Identity Service API
  version: 1.1.0
  description: |
    Servicio 01-ms-identity (Java 21 Spring Boot 4.1 :8081, schema `identity`).
    Personas, usuarios, sesiones y políticas de contraseña.
    `identity.city` está deprecado en el modelo (las ciudades vienen del API externo
    `countriesnow.space`), pero `CityController` y su tabla Liquibase siguen servidos.

    ## Fuente real
    - Controllers: `AuthController`, `UserController`, `PersonController`,
      `PasswordPolicyController`, `SessionController`, `CityController`, `HealthController`
    - DTOs: `UserDto{userId,personId,username,authenticationType,status,lastAccess,createdAt,updatedAt}`,
      `PersonDto{personId,documentType,documentNumber,name,lastName,email,phone,bloodType,birthDate,address}`,
      `PasswordPolicyDto{policyId,minLength,maxLength,requiresUppercase,requiresNumbers,requiresSymbols,expirationDays}`,
      `UserSessionDto{sessionId,userId,sessionStatus,startDate,endDate,sourceIp}`
    - Seguridad local: `SecurityConfig` + `AuthTokenFilter` (Bearer `sessionId` en todo `/api/**`
      salvo `login/logout/me` y `GET /sessions/*`). Kong solo aplica `cors` + `rate-limiting 60/min`
      (sin plugin jwt).

    ## Gateway
    Via Kong `http://localhost:8080/api/v1/persons|users|auth|sessions|cities|password-policies`
    + nested `~/users/.+/activate` (`kong.yml:6-15`).
    `POST /persons/{id}/transfer` no está implementado (Kong lo enruta por prefijo y el MS responde 404).

    ## Alcance
    La gestión de escuelas NO pertenece a este servicio: ver `03-academic-service.yaml`.

    ## Paginación
    Listas paged con `?page&limit` (1-based) → `PageResponse {data,meta{page,limit,total,totalPages}}`.

    ## Cambios 1.1.0 (fusión docs/api-implementation, sin rompimientos)
    Documentación aditiva sobre la base 1.0.0 de main: notas de `bcrypt cost 12`
    (ADR-008), unicidades `uq_user_username` / `uq_person_document` y restricción
    de activación con persona inactiva. Sin cambios de rutas, DTOs ni seguridad.

servers:
  - url: http://localhost:8081
    description: Direct (dev)
  - url: http://localhost:8080
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security: []

tags:
  - name: Auth
    description: Login, logout, sesión actual
  - name: User
    description: Cuentas de acceso
  - name: Person
    description: Personas (vínculo con academic-actor)
  - name: City
    description: DEPRECATED en el modelo (usar countriesnow.space) — endpoints legacy todavía servidos
  - name: PasswordPolicy
    description: Políticas de contraseña
  - name: Session
    description: Sesiones de usuario
  - name: Health
    description: Estado del servicio

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      summary: Health check (alias versionado)
      operationId: healthCheckV1
      tags: [Health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      summary: Iniciar sesión
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              identifier: admin@example.com
              password: Secret123!
      responses:
        '200':
          description: Sesión creada (el sessionId es el bearer token actual)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      summary: Cerrar sesión
      operationId: logout
      tags: [Auth]
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '204':
          description: Sesión cerrada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/auth/me:
    get:
      summary: Usuario actual por username o email
      operationId: getCurrentUser
      tags: [Auth]
      parameters:
        - name: username
          in: query
          required: false
          schema:
            type: string
          description: Identificador de login (uno de `username` o `email` es obligatorio)
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users:
    get:
      summary: Listar usuarios (paginado)
      operationId: listUsers
      tags: [User]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: '`PageResponse {data,meta{page,limit,total,totalPages}}`'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserDto'
                  - $ref: './_shared.yaml#/components/schemas/PaginatedMeta'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
    post:
      summary: Crear usuario
      operationId: createUser
      description: |
        La contraseña se hashea en el servidor con bcrypt cost 12 (ADR-008) antes de
        persistirse en `identity.app_user.password_hash`. `personId` debe referenciar
        una persona existente; cada persona admite un único usuario
        (`uq_app_user_person`) y `username` es único (`uq_user_username`).
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './_shared.yaml#/components/responses/Conflict'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Obtener usuario por ID
      operationId: getUserById
      tags: [User]
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar usuario
      operationId: updateUser
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '204':
          description: Actualizado
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Activar usuario
      operationId: activateUser
      description: Falla si la persona asociada está inactiva.
      tags: [User]
      responses:
        '204':
          description: Activado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    patch:
      summary: Cambiar estado del usuario
      operationId: setUserStatus
      tags: [User]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Estado actualizado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons:
    get:
      summary: Listar personas (paginado)
      operationId: listPersons
      tags: [Person]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: '`PageResponse {data,meta}`'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PersonDto'
                  - $ref: './_shared.yaml#/components/schemas/PaginatedMeta'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
    post:
      summary: Crear persona
      operationId: createPerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './_shared.yaml#/components/responses/Conflict'

  /api/v1/persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Obtener persona por ID
      operationId: getPersonById
      tags: [Person]
      responses:
        '200':
          description: Persona encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar persona
      operationId: updatePerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons/{id}/transfer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Transferir persona de escuela [NO IMPLEMENTADO]
      operationId: transferPerson
      tags: [Person]
      deprecated: true
      description: |
        NO IMPLEMENTADO: `PersonController` no expone esta ruta (Kong la enruta por prefijo
        `/api/v1/persons` y el MS responde 404). `person` is school-agnostic (DBML, no
        `school_id`); school linkage lives in `academic_actor`. Documented only so old
        clients fail fast with 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newSchoolId]
              properties:
                newSchoolId:
                  $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    patch:
      summary: Cambiar estado de persona
      operationId: setPersonStatus
      tags: [Person]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Estado actualizado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/cities:
    get:
      summary: Listar ciudades [legacy — modelo deprecado, preferir countriesnow.space]
      operationId: listCities
      tags: [City]
      deprecated: true
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: '`PageResponse {data,meta}`'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CityDto'
                  - $ref: './_shared.yaml#/components/schemas/PaginatedMeta'
    post:
      summary: Crear ciudad [legacy — modelo deprecado]
      operationId: createCity
      tags: [City]
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDto'
            example:
              name: Medellín
              department: Antioquia
      responses:
        '201':
          description: Ciudad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/cities/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener ciudad por ID [legacy — modelo deprecado]
      operationId: getCityById
      tags: [City]
      deprecated: true
      responses:
        '200':
          description: Ciudad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar ciudad [legacy — modelo deprecado]
      operationId: updateCity
      tags: [City]
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar ciudad [legacy — modelo deprecado]
      operationId: deleteCity
      tags: [City]
      deprecated: true
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/password-policies:
    get:
      summary: Listar políticas de contraseña
      operationId: listPasswordPolicies
      tags: [PasswordPolicy]
      responses:
        '200':
          description: Lista de políticas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasswordPolicyDto'
    post:
      summary: Crear política de contraseña
      operationId: createPasswordPolicy
      tags: [PasswordPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicyDto'
      responses:
        '201':
          description: Política creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/password-policies/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener política por ID
      operationId: getPasswordPolicyById
      tags: [PasswordPolicy]
      responses:
        '200':
          description: Política encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar política
      operationId: updatePasswordPolicy
      tags: [PasswordPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicyDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/sessions:
    get:
      summary: Listar sesiones (paginado)
      operationId: listSessions
      tags: [Session]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/PageParam'
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
      responses:
        '200':
          description: '`PageResponse {data,meta}`'
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/UserSessionDto'
                  - $ref: './_shared.yaml#/components/schemas/PaginatedMeta'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
    post:
      summary: Crear sesión
      operationId: createSession
      tags: [Session]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
        - name: sourceIp
          in: query
          required: false
          schema:
            type: string
            maxLength: 45
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'

  /api/v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: "Obtener sesión por ID (pública: la usa cada `AuthTokenFilter` para validar el bearer)"
      operationId: getSessionById
      tags: [Session]
      responses:
        '200':
          description: Sesión encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Cerrar sesión por ID
      operationId: closeSession
      tags: [Session]
      responses:
        '204':
          description: Sesión cerrada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/sessions/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Sesiones por usuario
      operationId: listSessionsByUser
      tags: [Session]
      responses:
        '200':
          description: Sesiones del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSessionDto'

components:
  schemas:
    AuthRequest:
      type: object
      description: |
        Payload de login. El identificador es un email O un username: el cliente puede
        enviar `{"identifier": …}`, `{"email": …}` o `{"username": …}` (mismo campo en
        Java con `@JsonAlias`).
      required: [password]
      properties:
        identifier:
          type: string
          description: Email o username de la cuenta
          example: admin@example.com
        email:
          type: string
          description: Alias de `identifier`
          format: email
          example: admin@example.com
        username:
          type: string
          description: Alias de `identifier`
          example: admin
        password:
          type: string
          format: password
          example: Secret123!
    UserDto:
      type: object
      required: [username]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        personId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        username:
          type: string
          example: admin@example.com
        authenticationType:
          type: string
          enum: [Local, Windows, External]
          example: Local
        status:
          type: boolean
          example: true
        lastAccess:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        createdAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        updatedAt:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
    PersonDto:
      type: object
      required: [documentNumber, name, lastName]
      properties:
        personId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        documentNumber:
          type: string
          example: '1234567890'
        documentType:
          type: string
          enum: [CC, TI, CE, PP]
          nullable: true
          example: CC
        name:
          type: string
          example: María
        lastName:
          type: string
          example: García
        email:
          type: string
          format: email
          nullable: true
          example: maria.garcia@email.com
        phone:
          type: string
          nullable: true
        bloodType:
          type: string
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]
          nullable: true
          example: O+
        birthDate:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
    CityDto:
      deprecated: true
      description: Legacy — la entidad `city` está deprecada en el modelo (el catálogo vive en `countriesnow.space`); el controlador y la tabla Liquibase siguen servidos.
      type: object
      required: [name]
      properties:
        cityId:
          type: integer
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Medellín
        department:
          type: string
          maxLength: 120
          nullable: true
          example: Antioquia
    PasswordPolicyDto:
      type: object
      properties:
        policyId:
          type: integer
        minLength:
          type: integer
          example: 8
        maxLength:
          type: integer
          example: 20
        requiresUppercase:
          type: boolean
          example: true
        requiresNumbers:
          type: boolean
          example: true
        requiresSymbols:
          type: boolean
          example: false
        expirationDays:
          type: integer
          example: 90
    UserSessionDto:
      type: object
      required: [sessionId, userId]
      properties:
        sessionId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        sessionStatus:
          type: string
          enum: [Active, Closed]
          example: Active
        startDate:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
        endDate:
          $ref: './_shared.yaml#/components/schemas/Timestamp'
          nullable: true
        sourceIp:
          type: string
          nullable: true
          example: 192.168.1.14
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
