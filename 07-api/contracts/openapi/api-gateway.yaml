  /api/v1/biometric/facial/verify:
    post:
      summary: Proxy → biometric verify (gateway-only session check)
      tags: [Biometric]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Proxied (ver 06-biometric-service.yaml)
          content:
