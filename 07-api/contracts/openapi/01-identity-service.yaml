openapi: 3.0.3
info:
  title: Identity Service API
  version: 1.0.0
  description: |
    Servicio 01-ms-identity (Java 21 Spring Boot :8081, schema `identity`).
    Personas, usuarios, ciudades, sesiones y políticas de contraseña.

    ## Fuente real
    - Controllers: `AuthController`, `UserController`, `PersonController`,
      `CityController`, `PasswordPolicyController`, `SessionController`, `HealthController`
    - DTOs: `UserDto{userId,username,authenticationType,status}`,
      `PersonDto{personId,name,lastName,email}`,
      `CityDto{cityId,name(1-120),department}`,
      `PasswordPolicyDto{policyId,minLength,maxLength,requiresUppercase,requiresNumbers,requiresSymbols,expirationDays}`,
      `UserSessionDto{sessionId,userId,sessionStatus}`
    - Seguridad local: `SecurityConfig permitAll /api/v1/**`. En Kong la ruta identity es **pública** (solo cors + rate-limit 60/min, sin jwt).

    ## Gateway
    Via Kong `http://localhost:8080/api/v1/persons|users|auth|sessions|cities|password-policies`
    + nested `~/persons/.+/transfer`, `~/users/.+/activate` (`kong.yml:6-15`).

servers:
  - url: http://localhost:8081
    description: Direct (dev)
  - url: http://localhost:8080
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security: []

tags:
  - name: Auth
    description: Login, logout, sesión actual
  - name: User
    description: Cuentas de acceso
  - name: Person
    description: Personas (vínculo con academic-actor)
  - name: City
    description: Catálogo de ciudades
  - name: PasswordPolicy
    description: Políticas de contraseña
  - name: Session
    description: Sesiones de usuario
  - name: Health
    description: Estado del servicio

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      summary: Health check (alias versionado)
      operationId: healthCheckV1
      tags: [Health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      summary: Iniciar sesión
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              username: admin@example.com
              password: Secret123!
      responses:
        '200':
          description: Sesión creada (el sessionId es el bearer token actual)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      summary: Cerrar sesión
      operationId: logout
      tags: [Auth]
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '204':
          description: Sesión cerrada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/auth/me:
    get:
      summary: Usuario actual
      operationId: getCurrentUser
      tags: [Auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string

  /api/v1/users:
    post:
      summary: Crear usuario
      operationId: createUser
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './_shared.yaml#/components/responses/Conflict'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Obtener usuario por ID
      operationId: getUserById
      tags: [User]
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar usuario
      operationId: updateUser
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '204':
          description: Actualizado
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Activar usuario
      operationId: activateUser
      tags: [User]
      responses:
        '204':
          description: Activado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    patch:
      summary: Cambiar estado del usuario
      operationId: setUserStatus
      tags: [User]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Estado actualizado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons:
    post:
      summary: Crear persona
      operationId: createPerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './_shared.yaml#/components/responses/Conflict'

  /api/v1/persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Obtener persona por ID
      operationId: getPersonById
      tags: [Person]
      responses:
        '200':
          description: Persona encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar persona
      operationId: updatePerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons/{id}/transfer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Transferir persona de escuela
      operationId: transferPerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newSchoolId]
              properties:
                newSchoolId:
                  $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '204':
          description: Transferida
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    patch:
      summary: Cambiar estado de persona
      operationId: setPersonStatus
      tags: [Person]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Estado actualizado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/cities:
    get:
      summary: Listar ciudades (único listado Java con paginación real)
      operationId: listCities
      tags: [City]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de ciudades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityDto'
    post:
      summary: Crear ciudad
      operationId: createCity
      tags: [City]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDto'
            example:
              name: Medellín
              department: Antioquia
      responses:
        '201':
          description: Ciudad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/cities/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener ciudad por ID
      operationId: getCityById
      tags: [City]
      responses:
        '200':
          description: Ciudad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar ciudad
      operationId: updateCity
      tags: [City]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar ciudad
      operationId: deleteCity
      tags: [City]
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/password-policies:
    get:
      summary: Listar políticas de contraseña
      operationId: listPasswordPolicies
      tags: [PasswordPolicy]
      responses:
        '200':
          description: Lista de políticas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasswordPolicyDto'
    post:
      summary: Crear política de contraseña
      operationId: createPasswordPolicy
      tags: [PasswordPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicyDto'
      responses:
        '201':
          description: Política creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/password-policies/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener política por ID
      operationId: getPasswordPolicyById
      tags: [PasswordPolicy]
      responses:
        '200':
          description: Política encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar política
      operationId: updatePasswordPolicy
      tags: [PasswordPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicyDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/sessions:
    post:
      summary: Crear sesión
      operationId: createSession
      tags: [Session]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
        - name: sourceIp
          in: query
          required: false
          schema:
            type: string
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'

  /api/v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    delete:
      summary: Cerrar sesión por ID
      operationId: closeSession
      tags: [Session]
      responses:
        '204':
          description: Sesión cerrada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/sessions/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Sesiones por usuario
      operationId: listSessionsByUser
      tags: [Session]
      responses:
        '200':
          description: Sesiones del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSessionDto'

components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin@example.com
        password:
          type: string
          format: password
          example: Secret123!
    UserDto:
      type: object
      required: [username]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        username:
          type: string
          example: admin@example.com
        authenticationType:
          type: string
          example: PASSWORD
        status:
          type: boolean
          example: true
    PersonDto:
      type: object
      required: [name, lastName]
      properties:
        personId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        name:
          type: string
          example: María
        lastName:
          type: string
          example: García
        email:
          type: string
          format: email
          nullable: true
          example: maria.garcia@email.com
    CityDto:
      type: object
      required: [name]
      properties:
        cityId:
          type: integer
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Medellín
        department:
          type: string
          maxLength: 120
          nullable: true
          example: Antioquia
    PasswordPolicyDto:
      type: object
      properties:
        policyId:
          type: integer
        minLength:
          type: integer
          example: 8
        maxLength:
          type: integer
          example: 100
        requiresUppercase:
          type: boolean
          example: true
        requiresNumbers:
          type: boolean
          example: true
        requiresSymbols:
          type: boolean
          example: false
        expirationDays:
          type: integer
          example: 90
    UserSessionDto:
      type: object
      required: [sessionId, userId]
      properties:
        sessionId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        sessionStatus:
          type: string
          example: Active
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
