openapi: 3.0.3
info:
  title: Academic Service API
  version: 1.0.0
  description: |
    Servicio 03-ms-academic (TS Fastify + Zod + Drizzle :8083, schema `academic`).
    Escuelas, programas, períodos, cohortes, cursos, tipos de actor, actores académicos y matrículas.

    ## Fuente real
    - `src/infrastructure/http/routes.ts:46 registerAcademicRoutes`, `src/main.ts:70`
    - Stores `schoolId,programId,academicPeriodId,cohortId,courseId,actorTypeId,academicActorId,enrollmentId`
    - Paginación `?limit=20&offset=0` cap 100 + header `x-total-count`; errores `{error:BadRequest|NotFound|SchoolNotFound,message,details?,timestamp}`
    - Gateway sin plugins propios (`kong.yml:50-56`) además del `pre-function` global de sesión; el propio MS también revalida la sesión y evalúa permisos en `src/infrastructure/http/authGuard.ts` (`registerAuthGuard`, corregido 2026-10-11).

servers:
  - url: http://localhost:8083
    description: Direct (dev)
  - url: http://localhost:8000
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security:
  - bearerAuth: []

tags:
  - name: School
  - name: Program
  - name: AcademicPeriod
  - name: Cohort
  - name: Course
  - name: ActorType
  - name: AcademicActor
  - name: Enrollment
  - name: Health

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
