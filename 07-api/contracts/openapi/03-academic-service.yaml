          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'

  /api/v1/academic-actors/{actorId}/enrollments:
    parameters:
      - name: actorId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Matrículas por actor
      operationId: listEnrollmentsByActor
      tags: [Enrollment]
      responses:
        '200':
          description: Matrículas del actor
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Enrollment'

components:
  schemas:
    School:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [schoolId, code, name]
          properties:
            schoolId:
              type: string
            code:
              type: string
              example: COL001
            name:
              type: string
              example: Colegio San José
            cityId:
              type: string
              nullable: true
              description: External countriesnow.space id, no FK (city table removed)
              example: CO-BOG
            cityName:
              type: string
              nullable: true
              example: Bogotá
            district:
              type: string
              nullable: true
            country:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            email:
              type: string
              format: email
              nullable: true
            status:
              type: boolean
              example: true
    SchoolInput:
      type: object
