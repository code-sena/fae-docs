openapi: 3.0.3
info:
  title: Authorization Service API
  version: 1.0.0
  description: |
    Servicio 02-ms-authorization (Java 21 Spring Boot 4.1 :8082, schema `authorization`).
    RBAC: roles, permisos, asignación a usuarios y evaluación.

    ## Fuente real
    - Controllers: `RoleController`, `PermissionController`, `UserRoleController`,
      `HealthController`, `QualityHealthController`
    - DTOs: `CreateRoleRequest{roleName*,description}`, `UpdateRoleRequest`,
      `RoleResponse{roleId,roleName,description}`,
      `CreatePermissionRequest{permissionName*,description}`, `UpdatePermissionRequest`,
      `PermissionResponse{permissionId,permissionName,description}`,
      `AssignRoleRequest{roleId}`, `AssignPermissionRequest{permissionId}`
    - Gateway: the edge `pre-function` (Lua) validates the opaque session UUID against identity
      before the request reaches this service, plus `rate-limiting 6000/min` and the global
      `cors`; no `jwt` plugin. The MS then validates the bearer again with `AuthTokenFilter`
      and resolves RBAC (`kong.yml`).
    - Legacy alias: every route is also declared **without** the `/api/v1` prefix (`/roles`,
      `/permissions`, `/user-roles`, `/users/{id}/roles`, `/auth/evaluate`). Kong routes only
      the `/api/v1/...` form; the alias works on the direct port only (and there
      `AuthTokenFilter` does not run, because it guards paths starting with `/api/`). Not part
      of the contract — do not use it.

servers:
  - url: http://localhost:8082
    description: Direct (dev)
  - url: http://localhost:8080
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security:
  - bearerAuth: []

tags:
  - name: Role
    description: Roles del sistema
  - name: Permission
    description: Permisos
  - name: UserRole
    description: Asignación usuario↔rol y evaluación RBAC
  - name: Health
    description: Estado del servicio

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      summary: Health check versionado
      tags: [Health]
      security: []
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /health/quality:
    get:
      summary: Reporte de calidad ISO
      tags: [Health]
      security: []
      responses:
        '200':
          description: Reporte de calidad
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/QualityReport'

  /api/v1/roles:
    get:
      summary: Listar roles
      operationId: listRoles
      tags: [Role]
      responses:
        '200':
          description: Lista de roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
    post:
      summary: Crear rol
      operationId: createRole
      tags: [Role]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
            example:
              roleName: INSTRUCTOR
              description: Docente con carga académica
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/roles/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener rol por ID
      operationId: getRoleById
      tags: [Role]
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar rol
      operationId: updateRole
      tags: [Role]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar rol
      operationId: deleteRole
      tags: [Role]
      responses:
        '204':
          description: Eliminado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/roles/{roleId}/permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Permisos de un rol
      operationId: listRolePermissions
      tags: [Role]
      responses:
        '200':
          description: Permisos del rol
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
    post:
      summary: Asignar permiso a rol
      operationId: assignPermissionToRole
      tags: [Role]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPermissionRequest'
      responses:
        '201':
          description: Permiso asignado

  /api/v1/roles/{roleId}/permissions/{permId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
      - name: permId
        in: path
        required: true
        schema:
          type: integer
    delete:
      summary: Quitar permiso de rol
      operationId: removePermissionFromRole
      tags: [Role]
      responses:
        '204':
          description: Permiso removido

  /api/v1/permissions:
    get:
      summary: Listar permisos
      operationId: listPermissions
      tags: [Permission]
      responses:
        '200':
          description: Lista de permisos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PermissionResponse'
    post:
      summary: Crear permiso
      operationId: createPermission
      tags: [Permission]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePermissionRequest'
            example:
              permissionName: attendance:write
              description: Registrar asistencia
      responses:
        '201':
          description: Permiso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'

  /api/v1/permissions/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener permiso por ID
      operationId: getPermissionById
      tags: [Permission]
      responses:
        '200':
          description: Permiso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar permiso
      operationId: updatePermission
      tags: [Permission]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        '200':
          description: Permiso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionResponse'
    delete:
      summary: Eliminar permiso
      operationId: deletePermission
      tags: [Permission]
      responses:
        '204':
          description: Eliminado

  /api/v1/users/{userId}/roles:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Roles de un usuario
      operationId: listUserRoles
      tags: [UserRole]
      responses:
        '200':
          description: Roles del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleResponse'
    post:
      summary: Asignar rol a usuario
      operationId: assignRoleToUser
      tags: [UserRole]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
      responses:
        '201':
          description: Rol asignado

  /api/v1/users/{userId}/roles/{roleId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
      - name: roleId
        in: path
        required: true
        schema:
          type: integer
    delete:
      summary: Quitar rol a usuario
      operationId: removeRoleFromUser
      tags: [UserRole]
      responses:
        '204':
          description: Rol removido

  /api/v1/user-roles:
    get:
      summary: Batch roles for many users
      description: One request for the whole users screen. Users without a role assignment are
        absent from the map; without `userIds` the answer is `{}`. Legacy alias without the
        `/api/v1` prefix exists in code but is not routed by the gateway.
      operationId: listUserRolesBatch
      tags: [UserRole]
      parameters:
        - name: userIds
          in: query
          required: false
          style: form
          explode: true
          description: Repeated or comma-separated UUIDs, at most 300 per request
          schema:
            type: array
            maxItems: 300
            items:
              $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '200':
          description: '`{userId: RoleResponse[]}`'
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    $ref: '#/components/schemas/RoleResponse'
        '400':
          description: More than 300 `userIds` in one request
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /api/v1/auth/evaluate:
    get:
      summary: Evaluar permiso (RBAC check)
      operationId: evaluatePermission
      tags: [UserRole]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
        - name: permission
          in: query
          required: true
          schema:
            type: string
            example: attendance:write
      responses:
        '200':
          description: Resultado de evaluación
          content:
            application/json:
              schema:
                type: object
                required: [userId, permission, allowed]
                properties:
                  userId:
                    $ref: './_shared.yaml#/components/schemas/UUID'
                  permission:
                    type: string
                  allowed:
                    type: boolean

components:
  schemas:
    CreateRoleRequest:
      type: object
      required: [roleName]
      properties:
        roleName:
          type: string
          maxLength: 255
          example: INSTRUCTOR
        description:
          type: string
          maxLength: 500
          nullable: true
    UpdateRoleRequest:
      type: object
      properties:
        roleName:
          type: string
        description:
          type: string
          nullable: true
    RoleResponse:
      type: object
      required: [roleId, roleName]
      properties:
        roleId:
          type: integer
          example: 3
        roleName:
          type: string
          example: INSTRUCTOR
        description:
          type: string
          nullable: true
    CreatePermissionRequest:
      type: object
      required: [permissionName]
      properties:
        permissionName:
          type: string
          example: attendance:write
        description:
          type: string
          nullable: true
    UpdatePermissionRequest:
      type: object
      properties:
        permissionName:
          type: string
        description:
          type: string
          nullable: true
    PermissionResponse:
      type: object
      required: [permissionId, permissionName]
      properties:
        permissionId:
          type: integer
        permissionName:
          type: string
        description:
          type: string
          nullable: true
    AssignRoleRequest:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: integer
    AssignPermissionRequest:
      type: object
      required: [permissionId]
      properties:
        permissionId:
          type: integer
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
