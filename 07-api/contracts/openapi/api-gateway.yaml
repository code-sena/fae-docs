openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Punto único de entrada (Kong OSS 3.6 DB-less + Redis 7).
    Fuente real: `back-end/99-api-gateway/kong/kong.yml` (`_format_version 3.0`, `strip_path:false`).

    ## Puertos
    - Proxy `:8080` (contenedor `8000`), Admin `:8001`.
    - Frontends MUST usar `:8080/api/v1/...`. Acceso directo a `8081-8091` solo para dev/debug.

    ## Autenticación
    ```
    Authorization: Bearer <token>
    ```
    Token de `POST /api/v1/auth/login` (identity 8081). Ver `../authentication.md`.
    Identidad es pública en Kong (cors + rate-limit 60/min, sin jwt); el resto exige `jwt`.
    Dev consumer `faceattend-admin` HS256 (`faceattend-admin-key`); prod objetivo RS256 de identity.

    ## Rate limits (Redis)
    Global 300/min; identity 60/min; authorization 100/min; attendance 200/min; quality 100/min.

    ## CORS
    Global `http://localhost:3000,http://localhost:5173` (`Authorization,Content-Type,X-Requested-With`, `credentials:true`, `max_age:3600`).
    Identity route `*` para dev.

    ## Headers internos (convención Kong→upstream)
    - `X-User-Id`, `X-User-Role`, `X-Correlation-Id` / `X-Request-Id`.

servers:
  - url: http://localhost:8080
    description: Via Kong (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

tags:
  - name: Health
    description: Estado del gateway y upstreams
  - name: Identity
    description: Proxied → ms-identity:8081 (público)
  - name: Authorization
    description: Proxied → ms-authorization:8083 (jwt)
  - name: Academic
    description: Proxied → ms-academic:8084 (jwt)
  - name: Scheduling
    description: Proxied → ms-scheduling:8087 (jwt)
  - name: Attendance
    description: Proxied → ms-attendance:8085 (jwt)
  - name: Biometric
    description: Proxied → ms-biometric:8086 (jwt)
  - name: Configuration
    description: Proxied → ms-configuration:8089 (jwt)
  - name: Notification
    description: Proxied → ms-notification:8090 (jwt)
  - name: Quality
    description: Proxied → ms-quality:8091 (jwt)

paths:
  /health:
    get:
      summary: Health check del gateway
      tags: [Health]
      security: []
      responses:
        '200':
          description: Gateway y upstreams saludables
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  timestamp:
                    type: string
                    format: date-time
                  upstreams:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, down]
              example:
                status: ok
                timestamp: '2024-01-15T10:30:00Z'
                upstreams:
                  identity-service: ok
                  authorization-service: ok
                  academic-service: ok
                  scheduling-service: ok
                  attendance-service: ok
                  biometric-service: ok
                  configuration-service: ok
                  notification-service: ok
                  quality-service: ok
        '503':
          description: Gateway iniciando o upstream crítico caído
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'

  /health/quality:
    get:
      summary: Health de calidad (proxied a academic:8084, solo CORS GET)
      tags: [Health]
      security: []
      responses:
        '200':
          description: Reporte de calidad
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/QualityReport'

  /api/v1/persons:
    get:
      summary: Proxy → identity (ver 01-identity-service.yaml)
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/users:
    get:
      summary: Proxy → identity
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/login:
    post:
      summary: Proxy → identity login (público, obtiene token)
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                type: object
  /api/v1/sessions:
    post:
      summary: Proxy → identity sessions (público)
      tags: [Identity]
      security: []
      responses:
        '201':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/cities:
    get:
      summary: Proxy → identity cities (?limit&offset, público)
      tags: [Identity]
      security: []
      parameters:
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
