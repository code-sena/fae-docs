openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Punto único de entrada (Kong OSS 3.6 DB-less + Redis 7).
    Fuente real: `back-end/99-api-gateway/kong/kong.yml` (`_format_version 3.0`, `strip_path:false`).

    ## Puertos
    - Proxy `:8080` (contenedor `8000`), Admin `:8001`.
    - Frontends MUST usar `:8080/api/v1/...`. Acceso directo a `8081-8089` solo para dev/debug.

    ## Autenticación
    ```
    Authorization: Bearer <sessionId>
    ```
    `sessionId` opaco (UUID) de `POST /api/v1/auth/login` (identity 8081; `identifier` = email o
    username). Ver `../authentication.md`.
    **Kong NO tiene plugin `jwt` ni consumers** (solo `cors` + `rate-limiting`): la validación de
    la sesión la hace cada MS Java (`01/02/04/05`, `AuthTokenFilter`). Los servicios TS/Python/Go
    (`03/06/07/08/09`) no validan el bearer hoy (tech-debt). Objetivo: `jwt` RS256 de identity (ADR-007).

    ## Rate limits (Redis)
    Global 300/min; identity 60/min; authorization 100/min; attendance 200/min; quality 100/min.

    ## CORS
    Global `http://localhost:3000,http://localhost:5173,http://localhost:8090` (`Authorization,Content-Type,X-Requested-With`, `credentials:true`, `max_age:3600`).
    Identity route `*` para dev.

    ## Headers internos (convención Kong→upstream)
    - `X-User-Id`, `X-User-Roles` (fijados por el `AuthTokenFilter` Java), `X-Correlation-Id` / `X-Request-Id`.

    ## Health
    El gateway NO expone `GET /health`; solo rutea `GET /health/quality` → `ms-academic:8083`.
    Las saludades se prueban directo contra cada puerto.

servers:
  - url: http://localhost:8080
    description: Via Kong (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

tags:
  - name: Health
    description: Estado de los upstreams (solo `/health/quality` está ruteado)
  - name: Identity
    description: Proxied → ms-identity:8081 (rutas de bootstrap públicas; el resto exige bearer)
  - name: Authorization
    description: Proxied → ms-authorization:8082 (bearer validado en el MS)
  - name: Academic
    description: Proxied → ms-academic:8083 (sin validación en el MS hoy)
  - name: Scheduling
    description: Proxied → ms-scheduling:8084 (bearer validado en el MS)
  - name: Attendance
    description: Proxied → ms-attendance:8085 (bearer validado en el MS)
  - name: Biometric
    description: Proxied → ms-biometric:8086 (sin validación en el MS hoy)
  - name: Configuration
    description: Proxied → ms-configuration:8087 (sin validación en el MS hoy)
  - name: Notification
    description: Proxied → ms-notification:8088 (sin validación en el MS hoy)
  - name: Quality
    description: Proxied → ms-quality:8089 (sin validación en el MS hoy)

paths:
  /health/quality:
    get:
      summary: Health de calidad (proxied a ms-academic:8083, solo CORS GET; única ruta de health en el gateway)
      tags: [Health]
      security: []
      responses:
        '200':
          description: Reporte de calidad
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/QualityReport'

  /api/v1/persons:
    get:
      summary: Proxy → identity (ver 01-identity-service.yaml)
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/users:
    get:
      summary: Proxy → identity
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/auth/login:
    post:
      summary: Proxy → identity login (público, obtiene `sessionId` opaco)
      tags: [Identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                identifier:
                  type: string
                  description: Email o username (alias aceptados: `email`, `username`)
                email:
                  type: string
                  description: Alias de `identifier`
                username:
                  type: string
                  description: Alias de `identifier`
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Sesión creada
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
  /api/v1/sessions:
    post:
      summary: Proxy → identity sessions (público)
      tags: [Identity]
      security: []
      responses:
        '201':
          description: Proxied
          content:
            application/json:
              schema:
                type: object
  /api/v1/password-policies:
    get:
      summary: Proxy → identity password-policies (público)
      tags: [Identity]
      security: []
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/v1/roles:
    get:
      summary: Proxy → authorization (401 sin bearer en el MS, 100/min)
      tags: [Authorization]
      responses:
        '200':
          description: Proxied (ver 02-authorization-service.yaml)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
  /api/v1/permissions:
    get:
      summary: Proxy → authorization (401 sin bearer en el MS)
      tags: [Authorization]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/auth/evaluate:
    get:
      summary: Proxy → authorization RBAC check (401 sin bearer en el MS)
      tags: [Authorization]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
        - name: permission
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{userId,permission,allowed}'
          content:
            application/json:
              schema:
                type: object

  /api/v1/schools:
    get:
      summary: Proxy → academic (sin auth en el MS hoy)
      tags: [Academic]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
