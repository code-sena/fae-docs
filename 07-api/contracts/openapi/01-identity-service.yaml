openapi: 3.0.3
info:
  title: Identity Service API
  version: 1.1.0
  description: |
    Servicio 01-ms-identity (Java 21 Spring Boot :8081, schema `identity`).
    Personas, usuarios, sesiones y políticas de contraseña.
    `identity.city` DEPRECATED/removed (DBML v6/v7): cities come from external `countriesnow.space` API.

    ## Fuente real
    - Controllers: `AuthController`, `UserController`, `PersonController`,
      `PasswordPolicyController`, `SessionController`, `HealthController`
      (`CityController` deprecated, pending removal)
    - DTOs: `UserDto{userId,username,authenticationType,status}`,
      `PersonDto{personId,documentType,documentNumber,name,lastName,email,phone,bloodType,birthDate,address}`,
      `PasswordPolicyDto{policyId,minLength,maxLength,requiresUppercase,requiresNumbers,requiresSymbols,expirationDays}`,
      `UserSessionDto{sessionId,userId,sessionStatus}`
    - Seguridad local: `SecurityConfig permitAll /api/v1/**`. En Kong la ruta identity es **pública** (solo cors + rate-limit 60/min, sin jwt).

    ## Gateway
    Via Kong `http://localhost:8080/api/v1/persons|users|auth|sessions|password-policies`
    + nested `~/persons/.+/transfer`, `~/users/.+/activate` (`kong.yml:6-15`).
    `/cities` removed — use external `countriesnow.space` API.

    ## Alcance
    La gestión de escuelas NO pertenece a este servicio: ver `03-academic-service.yaml`.

    ## Cambios 1.1.0 (fusión docs/api-implementation, sin rompimientos)
    Documentación aditiva sobre la base 1.0.0 de main: notas de `bcrypt cost 12`
    (ADR-008), unicidades `uq_user_username` / `uq_person_document` y restricción
    de activación con persona inactiva. Sin cambios de rutas, DTOs ni seguridad.

servers:
  - url: http://localhost:8081
    description: Direct (dev)
  - url: http://localhost:8080
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security: []

tags:
  - name: Auth
    description: Login, logout, sesión actual
  - name: User
    description: Cuentas de acceso
  - name: Person
    description: Personas (vínculo con academic-actor)
  - name: City
    description: DEPRECATED — removed in DBML v6/v7, use external countriesnow.space API
  - name: PasswordPolicy
    description: Políticas de contraseña
  - name: Session
    description: Sesiones de usuario
  - name: Health
    description: Estado del servicio

paths:
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      tags: [Health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      summary: Health check (alias versionado)
      operationId: healthCheckV1
      tags: [Health]
      responses:
        '200':
          description: Servicio saludable
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'

  /api/v1/auth/login:
    post:
      summary: Iniciar sesión
      operationId: login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
            example:
              username: admin@example.com
              password: Secret123!
      responses:
        '200':
          description: Sesión creada (el sessionId es el bearer token actual)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /api/v1/auth/logout:
    post:
      summary: Cerrar sesión
      operationId: logout
      tags: [Auth]
      parameters:
        - name: sessionId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '204':
          description: Sesión cerrada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/auth/me:
    get:
      summary: Usuario actual
      operationId: getCurrentUser
      tags: [Auth]
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Usuario actual
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string

  /api/v1/users:
    post:
      summary: Crear usuario
      operationId: createUser
      description: |
        La contraseña se hashea en el servidor con bcrypt cost 12 (ADR-008) antes de
        persistirse en `identity.app_user.password_hash`. `personId` debe referenciar
        una persona existente; cada persona admite un único usuario
        (`uq_app_user_person`) y `username` es único (`uq_user_username`).
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './_shared.yaml#/components/responses/Conflict'

  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Obtener usuario por ID
      operationId: getUserById
      tags: [User]
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar usuario
      operationId: updateUser
      tags: [User]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDto'
      responses:
        '204':
          description: Actualizado
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Activar usuario
      operationId: activateUser
      description: Falla si la persona asociada está inactiva.
      tags: [User]
      responses:
        '204':
          description: Activado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/users/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    patch:
      summary: Cambiar estado del usuario
      operationId: setUserStatus
      tags: [User]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Estado actualizado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons:
    post:
      summary: Crear persona
      operationId: createPerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '201':
          description: Persona creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          $ref: './_shared.yaml#/components/responses/Conflict'

  /api/v1/persons/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Obtener persona por ID
      operationId: getPersonById
      tags: [Person]
      responses:
        '200':
          description: Persona encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar persona
      operationId: updatePerson
      tags: [Person]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons/{id}/transfer:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Transferir persona de escuela [DEPRECATED — person has no school_id]
      operationId: transferPerson
      tags: [Person]
      deprecated: true
      description: |
        DEPRECATED. `person` is school-agnostic (DBML v7, no `school_id`);
        school linkage lives in `academic_actor`. Transfer is an
        `academic_actor`-level operation, not a person-level one.
        Kept for history; do not implement new callers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newSchoolId]
              properties:
                newSchoolId:
                  $ref: './_shared.yaml#/components/schemas/UUID'
      responses:
        '204':
          description: Transferida
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/persons/{id}/status:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    patch:
      summary: Cambiar estado de persona
      operationId: setPersonStatus
      tags: [Person]
      parameters:
        - name: status
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '204':
          description: Estado actualizado
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/cities:
    get:
      summary: Listar ciudades [DEPRECATED — removed, use countriesnow.space]
      operationId: listCities
      tags: [City]
      deprecated: true
      parameters:
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de ciudades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CityDto'
    post:
      summary: Crear ciudad [DEPRECATED — removed]
      operationId: createCity
      tags: [City]
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDto'
            example:
              name: Medellín
              department: Antioquia
      responses:
        '201':
          description: Ciudad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/cities/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener ciudad por ID [DEPRECATED — removed]
      operationId: getCityById
      tags: [City]
      deprecated: true
      responses:
        '200':
          description: Ciudad encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CityDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar ciudad [DEPRECATED — removed]
      operationId: updateCity
      tags: [City]
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CityDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar ciudad [DEPRECATED — removed]
      operationId: deleteCity
      tags: [City]
      deprecated: true
      responses:
        '204':
          description: Eliminada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/password-policies:
    get:
      summary: Listar políticas de contraseña
      operationId: listPasswordPolicies
      tags: [PasswordPolicy]
      responses:
        '200':
          description: Lista de políticas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasswordPolicyDto'
    post:
      summary: Crear política de contraseña
      operationId: createPasswordPolicy
      tags: [PasswordPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicyDto'
      responses:
        '201':
          description: Política creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDto'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'

  /api/v1/password-policies/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/IntIdParam'
    get:
      summary: Obtener política por ID
      operationId: getPasswordPolicyById
      tags: [PasswordPolicy]
      responses:
        '200':
          description: Política encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordPolicyDto'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar política
      operationId: updatePasswordPolicy
      tags: [PasswordPolicy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordPolicyDto'
      responses:
        '204':
          description: Actualizada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/sessions:
    post:
      summary: Crear sesión
      operationId: createSession
      tags: [Session]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            $ref: './_shared.yaml#/components/schemas/UUID'
        - name: sourceIp
          in: query
          required: false
          schema:
            type: string
            maxLength: 45
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSessionDto'

  /api/v1/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    delete:
      summary: Cerrar sesión por ID
      operationId: closeSession
      tags: [Session]
      responses:
        '204':
          description: Sesión cerrada
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/sessions/user/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    get:
      summary: Sesiones por usuario
      operationId: listSessionsByUser
      tags: [Session]
      responses:
        '200':
          description: Sesiones del usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSessionDto'

components:
  schemas:
    AuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin@example.com
        password:
          type: string
          format: password
          example: Secret123!
    UserDto:
      type: object
      required: [username]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        username:
          type: string
          example: admin@example.com
        authenticationType:
          type: string
          enum: [Local, Windows, External]
          example: Local
        status:
          type: boolean
          example: true
    PersonDto:
      type: object
      required: [documentNumber, name, lastName]
      properties:
        personId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        documentNumber:
          type: string
          example: '1234567890'
        documentType:
          type: string
          enum: [CC, TI, CE, PP]
          nullable: true
          example: CC
        name:
          type: string
          example: María
        lastName:
          type: string
          example: García
        email:
          type: string
          format: email
          nullable: true
          example: maria.garcia@email.com
        phone:
          type: string
          nullable: true
        bloodType:
          type: string
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]
          nullable: true
          example: O+
        birthDate:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
    CityDto:
      deprecated: true
      description: DEPRECATED — removed in DBML v6/v7, use external countriesnow.space API.
      type: object
      required: [name]
      properties:
        cityId:
          type: integer
          example: 1
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Medellín
        department:
          type: string
          maxLength: 120
          nullable: true
          example: Antioquia
    PasswordPolicyDto:
      type: object
      properties:
        policyId:
          type: integer
        minLength:
          type: integer
          example: 8
        maxLength:
          type: integer
          example: 20
        requiresUppercase:
          type: boolean
          example: true
        requiresNumbers:
          type: boolean
          example: true
        requiresSymbols:
          type: boolean
          example: false
        expirationDays:
          type: integer
          example: 90
    UserSessionDto:
      type: object
      required: [sessionId, userId]
      properties:
        sessionId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        sessionStatus:
          type: string
          enum: [Active, Closed]
          example: Active
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
