              schema:
                type: array
                items:
                  type: object
  /api/v1/courses:
    get:
      summary: Proxy → academic (gateway-only session check)
      tags: [Academic]
      responses:
        '200':
          description: Proxied
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
  /api/v1/academic-actors:
    get:
      summary: Proxy → academic (gateway-only session check)
      tags: [Academic]
