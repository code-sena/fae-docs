openapi: 3.0.3
info:
  title: Notification Service API
  version: 1.0.0
  description: |
    Servicio 08-ms-notification (TypeScript Fastify + Drizzle + kafkajs :8088, schema `notification`;
    reescrito desde Go 1.22/Gin/pgx el 2026-10-18 — ADR-021, paridad funcional).
    Tipos de alerta y alertas sobre `academic_actor`.

    ## Fuente real
    - Handlers: `src/infrastructure/http/routes.ts`, `authGuard.ts`, `permissions.ts`,
      `actorScope.ts`, `qualityMiddleware.ts`, `src/main.ts`
    - Consumidores Kafka (no son rutas HTTP): `justification.consumer.ts` —
      `attendance.justification.events` (grupo `notification-service`, solo con `KAFKA_BROKERS`); y
      `classSession.consumer.ts` — `scheduling.class-session.closed` (grupo
      `notification-service-class-session`; además exige `NOTIFICATION_SERVICE_USERNAME`/`PASSWORD`).
      Con esas credenciales también arranca el planificador diario de alumnos en riesgo.
    - Formato de campos: **camelCase** en peticiones y respuestas (`alertId`, `academicActorId`,
      `alertTypeId`, `raisedAt`, `resolvedAt`, `createdAt`…), igual que el resto de servicios; la única
      excepción es el cuerpo 201 de `POST /alerts`, que devuelve `{alert_id}` en snake_case.
    - Dominio: `Alert{alertId,academicActorId,alertTypeId,raisedAt,resolvedAt?,createdAt,updatedAt?,rowVersion}`,
      `AlertType{alertTypeId,code,name,severity,channel,…}`
    - Comandos: `CreateAlertCommand{academicActorId*,alertTypeId*}`,
      `CreateAlertTypeCommand{code*,name*,severity*,channel?}`, `UpdateAlertTypeCommand{code?,name?,severity?,channel?}`
    - Filtros: `?actorId&?typeId&?resolved|?status=open|resolved|pending`; `?limit&offset` (types default 50/0)
    - Envelopes: `{alerts:[]}`, `{alert_types:[]}`; errores `{error,message,timestamp}`
    - Seeds reales de `alert_type` (5 base en `08-ms-notification-db/02-dml/001-seed-alert-type-table.yaml`
      + 2 de justificación en `003-seed-justification-result-alert-types.yaml`, 7 en total):
      `ATTENDANCE_ABSENTEEISM` (WARNING/DASHBOARD), `ATTENDANCE_TARDINESS` (WARNING/DASHBOARD),
      `ATTENDANCE_LOW` (CRITICAL/EMAIL), `JUSTIFICATION_PENDING` (INFO/DASHBOARD),
      `BIOMETRIC_UPDATE` (INFO/PUSH), `JUSTIFICATION_APPROVED` y `JUSTIFICATION_REJECTED`
      (INFO/DASHBOARD, los que usa el consumidor de justificaciones). Los códigos `ABSENCE_THRESHOLD`/`SCHEDULE_CONFLICT` que
      citaba la versión anterior de este contrato **no existen**.
      `notification-preferences` documentado en SERVICE.md NO existe.
    - Gateway: no per-upstream plugins (solo el `rate-limiting` global de 6000/min). The edge `pre-function` validates
      the opaque session UUID for `/api/v1/alerts` and `/api/v1/alert-types`; the MS itself also
      validates it again on its own via `registerAuthGuard` and adds RBAC (corrected
      2026-10-20 — `AT-004` is duplicated auth code across stacks, not a missing check).
    - **Internal only:** `POST /api/v1/emails` has **no Kong route** — it is reachable only
      inside the compose network (01-ms-identity calls it after issuing a recovery code).
      Optional shared secret `X-Internal-Token` (`EMAIL_INTERNAL_TOKEN`; when empty the route
      is open inside the network).
    - **Aliases sin prefijo:** los handlers se registran también bajo `/alerts` y
      `/alert-types`; Kong no los enruta, existen para llamadas internas directas a :8088.

servers:
  - url: http://localhost:8088
    description: Direct (dev)
  - url: http://localhost:8000
    description: Via Kong gateway (dev, preferred)
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

security:
  - bearerAuth: []

tags:
  - name: Alert
  - name: AlertType
  - name: Email
    description: Internal email channel (no Kong route)
  - name: Health

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /api/v1/health:
    get:
      summary: Health versionado
      tags: [Health]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/HealthResponse'
  /health/quality:
    get:
      summary: Reporte de calidad
      tags: [Health]
      description: Requiere permiso `configuration:manage` (no es público, a diferencia de `/health`).
      responses:
        '200':
          description: Reporte
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/QualityReport'

  /api/v1/alerts:
    get:
      summary: Listar alertas (filtros actor/tipo/estado + paginación)
      operationId: listAlerts
      tags: [Alert]
      parameters:
        - name: actorId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: typeId
          in: query
          required: false
          schema:
            type: integer
        - name: resolved
          in: query
          required: false
          schema:
            type: boolean
        - name: status
          in: query
          required: false
          description: Alias open|pending|resolved
          schema:
            type: string
            enum: [open, pending, resolved]
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de alertas
          content:
            application/json:
              schema:
                type: object
                required: [alerts]
                properties:
                  alerts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
    post:
      summary: Crear alerta manual
      operationId: createAlert
      tags: [Alert]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertCommand'
            example:
              academicActorId: 77
              alertTypeId: 1
      responses:
        '201':
          description: Alerta creada (solo devuelve el id)
          content:
            application/json:
              schema:
                type: object
                required: [alert_id]
                properties:
                  alert_id:
                    type: integer
                    format: int64
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/alerts/{id}:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    get:
      summary: Obtener alerta
      operationId: getAlert
      tags: [Alert]
      responses:
        '200':
          description: Alerta encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    delete:
      summary: Eliminar alerta
      operationId: deleteAlert
      tags: [Alert]
      responses:
        '204':
          description: Eliminada

  /api/v1/alerts/{id}/resolve:
    parameters:
      - $ref: './_shared.yaml#/components/parameters/LongIdParam'
    patch:
      summary: Resolver alerta (set resolvedAt)
      operationId: resolveAlert
      tags: [Alert]
      responses:
        '200':
          description: Alerta resuelta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'

  /api/v1/alert-types:
    get:
      summary: Listar tipos de alerta
      operationId: listAlertTypes
      tags: [AlertType]
      parameters:
        - $ref: './_shared.yaml#/components/parameters/LimitParam'
        - $ref: './_shared.yaml#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Lista de tipos
          content:
            application/json:
              schema:
                type: object
                required: [alert_types]
                properties:
                  alert_types:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertType'
    post:
      summary: Crear tipo de alerta
      operationId: createAlertType
      tags: [AlertType]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertTypeCommand'
            example:
              code: ATTENDANCE_CRITICAL
              name: Asistencia crítica
              severity: WARNING
              channel: DASHBOARD
      responses:
        '201':
          description: Tipo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertType'

  /api/v1/alert-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Obtener tipo de alerta
      operationId: getAlertType
      tags: [AlertType]
      responses:
        '200':
          description: Tipo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertType'
        '404':
          $ref: './_shared.yaml#/components/responses/NotFound'
    put:
      summary: Actualizar tipo de alerta
      operationId: updateAlertType
      tags: [AlertType]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertTypeCommand'
      responses:
        '200':
          description: Tipo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertType'
    delete:
      summary: Eliminar tipo de alerta
      operationId: deleteAlertType
      tags: [AlertType]
      responses:
        '204':
          description: Eliminado

  /api/v1/emails:
    post:
      summary: Send a templated email — INTERNAL ONLY (no Kong route)
      description: |
        Internal endpoint: 01-ms-identity posts here after generating a password-recovery code,
        and this service owns the SMTP transport plus the templates. The payload is deliberately
        narrow (template + data, no free-form subject/body) so the route cannot be used as an
        open relay. **Kong does not expose it** — it is reachable only inside the compose
        network, so it is documented here for completeness and not as part of the public API.
        With `SMTP_HOST` empty the answer is `202 {status:"skipped"}` and the gap is only
        logged.
      operationId: sendEmail
      tags: [Email]
      security: []
      parameters:
        - name: X-Internal-Token
          in: header
          required: false
          description: Shared secret from `EMAIL_INTERNAL_TOKEN`. When the variable is unset the route stays open inside the compose network.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, template]
              properties:
                to:
                  type: string
                  format: email
                template:
                  type: string
                  enum: [verification_code, login_code, user_credentials]
                  description: "Whitelisted templates (no free-form subject/body). Required data keys - `verification_code` and `login_code` take `code`; `user_credentials` takes `username` and `password`"
                data:
                  type: object
                  additionalProperties:
                    type: string
                  description: Template variables (see `template` for the required keys)
            example:
              to: apprentice@example.com
              template: verification_code
              data:
                code: '482913'
      responses:
        '202':
          description: '`{status:"accepted"}` when delivered, or `{status:"skipped",reason:"smtp_not_configured"}` when SMTP is not configured'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [accepted, skipped]
                  reason:
                    type: string
        '400':
          description: '`VALIDATION_ERROR` — malformed body, invalid `to`, unsupported template or missing template data'
          content:
            application/json:
              schema:
                type: object
        '403':
          description: '`FORBIDDEN` — missing or invalid `X-Internal-Token` (only when `EMAIL_INTERNAL_TOKEN` is set)'
          content:
            application/json:
              schema:
                type: object
        '502':
          description: '`DELIVERY_FAILED` — SMTP transport error'
          content:
            application/json:
              schema:
                type: object

components:
  schemas:
    Alert:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [alertId, academicActorId, alertTypeId, raisedAt]
          properties:
            alertId:
              type: integer
              format: int64
            academicActorId:
              type: integer
              format: int64
              description: Cross-context academic_actor id, no FK
            alertTypeId:
              type: integer
            raisedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
            resolvedAt:
              $ref: './_shared.yaml#/components/schemas/Timestamp'
              nullable: true
    CreateAlertCommand:
      type: object
      required: [academicActorId, alertTypeId]
      properties:
        academicActorId:
          type: integer
          format: int64
        alertTypeId:
          type: integer
    AlertType:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required: [alertTypeId, code, name, severity, channel]
          properties:
            alertTypeId:
              type: integer
            code:
              type: string
              example: ATTENDANCE_LOW
            name:
              type: string
            severity:
              type: string
              enum: [INFO, WARNING, CRITICAL]
              example: WARNING
            channel:
              type: string
              enum: [DASHBOARD, EMAIL, PUSH]
              example: DASHBOARD
    CreateAlertTypeCommand:
      type: object
      required: [code, name, severity]
      properties:
        code:
          type: string
        name:
          type: string
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
        channel:
          type: string
          enum: [DASHBOARD, EMAIL, PUSH]
          default: DASHBOARD
    UpdateAlertTypeCommand:
      type: object
      properties:
        code:
          type: string
          nullable: true
        name:
          type: string
          nullable: true
        severity:
          type: string
          enum: [INFO, WARNING, CRITICAL]
          nullable: true
        channel:
          type: string
          enum: [DASHBOARD, EMAIL, PUSH]
          nullable: true
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
